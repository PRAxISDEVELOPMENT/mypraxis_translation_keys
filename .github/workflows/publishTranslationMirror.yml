#
# Cloudflare Pages deploys the generated locale files through its GitHub
# integration. This workflow waits for that deployment and verifies that the
# fixed CDN URLs contain the exact bytes committed to main.
#

name: Verify Cloudflare Translation CDN

on:
  push:
    branches:
      - main
    paths:
      - 'i18n/artifacts/generated/en.json'
      - 'i18n/artifacts/generated/fr.json'
      - 'i18n/artifacts/generated/nl.json'
      - 'scripts/prepare-cloudflare-pages.js'
      - 'scripts/sync-translation-mirror.js'
      - 'package.json'
      - '.github/workflows/publishTranslationMirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-cdn-mirror
  cancel-in-progress: true

env:
  TRANSLATION_CDN_BASE_URL: ${{ vars.TRANSLATION_CDN_BASE_URL || 'https://mypraxis-translations.pages.dev' }}

jobs:
  sync:
    name: Verify Published Translation Files
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PAGES_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Translation Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Generated Artifacts Are In Sync
        run: npm run translations:check

      - name: Prepare Cloudflare Pages Output
        run: npm run translations:prepare-cdn

      - name: Verify GitHub Raw And Cloudflare Pages
        run: node scripts/sync-translation-mirror.js
