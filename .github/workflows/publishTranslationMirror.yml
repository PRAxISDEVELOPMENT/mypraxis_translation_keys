#
# Verifies that GitHub Raw and jsDelivr serve the exact generated locale bytes
# for the same immutable Git commit. Mutable branch URLs and cache purges are
# intentionally not used.
#

name: Verify Immutable Translation CDN

on:
  push:
    branches:
      - main
    paths:
      - 'i18n/artifacts/generated/en.json'
      - 'i18n/artifacts/generated/fr.json'
      - 'i18n/artifacts/generated/nl.json'
      - 'scripts/sync-translation-mirror.js'
      - '.github/workflows/publishTranslationMirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-cdn-mirror
  cancel-in-progress: true

jobs:
  sync:
    name: Verify Immutable Translation Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Translation Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Generated Artifacts Are In Sync
        run: npm run translations:check

      - name: Verify GitHub Raw And jsDelivr At Commit SHA
        run: node scripts/sync-translation-mirror.js
