name: Build translations

on:
  pull_request:
    paths:
      - 'i18n/translations.json'
      - 'i18n/namespaces.json'
      - 'i18n/buildTranslations.js'
      - '.github/workflows/buildTranslations.yml'
  push:
    branches:
      - main
    paths:
      - 'i18n/translations.json'
      - 'i18n/namespaces.json'
      - 'i18n/buildTranslations.js'
      - '.github/workflows/buildTranslations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate translation source structure
        run: node i18n/buildTranslations.js

      - name: Check generator output is stable
        run: node i18n/buildTranslations.js --check

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build translations
        run: node i18n/buildTranslations.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add i18n/generated/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "AUTO: generate locale files"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
