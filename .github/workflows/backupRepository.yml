#
# Creates a scheduled repository backup.
# A local artifact is useful for convenience, but the real disaster-recovery path
# is pushing a mirror to a separate private backup repository.
#

name: Backup Translation Repository

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    name: Create Repository Backup
    env:
      BACKUP_REPO_URL: ${{ secrets.BACKUP_REPO_URL }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
      BACKUP_REPO_USERNAME: ${{ secrets.BACKUP_REPO_USERNAME }}
      BACKUP_REPO_SSH_URL: ${{ secrets.BACKUP_REPO_SSH_URL }}
      BACKUP_REPO_SSH_KEY: ${{ secrets.BACKUP_REPO_SSH_KEY }}

    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Git Bundle
        run: |
          mkdir -p backup
          git bundle create "backup/mypraxis_translation_keys-${GITHUB_RUN_ID}.bundle" --all

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v6
        with:
          name: repository-backup-${{ github.run_id }}
          path: backup/*.bundle
          retention-days: 90

      - name: Configure SSH Mirror Authentication
        if: ${{ env.BACKUP_REPO_SSH_URL != '' && env.BACKUP_REPO_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BACKUP_REPO_SSH_KEY" > ~/.ssh/backup_repo
          chmod 600 ~/.ssh/backup_repo
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Mirror To External Backup Repository Over SSH
        if: ${{ env.BACKUP_REPO_SSH_URL != '' && env.BACKUP_REPO_SSH_KEY != '' }}
        run: |
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_repo -o IdentitiesOnly=yes"
          git ls-remote "$BACKUP_REPO_SSH_URL" > /dev/null
          git remote add backup "$BACKUP_REPO_SSH_URL"
          git push --mirror backup

      - name: Mirror To External Backup Repository Over HTTPS
        if: ${{ (env.BACKUP_REPO_SSH_URL == '' || env.BACKUP_REPO_SSH_KEY == '') && env.BACKUP_REPO_URL != '' && env.BACKUP_REPO_TOKEN != '' && env.BACKUP_REPO_USERNAME != '' }}
        run: |
          case "$BACKUP_REPO_URL" in
            https://*)
              AUTH_URL="$(printf '%s' "$BACKUP_REPO_URL" | sed "s#https://#https://${BACKUP_REPO_USERNAME}:${BACKUP_REPO_TOKEN}@#")"
              ;;
            *)
              echo "BACKUP_REPO_URL must be an https URL."
              exit 1
              ;;
          esac

          git ls-remote "$AUTH_URL" > /dev/null
          git remote add backup "$AUTH_URL"
          git push --mirror backup

      - name: Explain Missing External Mirror Configuration
        if: ${{ !((env.BACKUP_REPO_SSH_URL != '' && env.BACKUP_REPO_SSH_KEY != '') || (env.BACKUP_REPO_URL != '' && env.BACKUP_REPO_TOKEN != '' && env.BACKUP_REPO_USERNAME != '')) }}
        run: |
          echo "External mirror backup is not configured."
          echo "Configure either SSH mirror secrets or HTTPS mirror secrets."
          echo "SSH: BACKUP_REPO_SSH_URL + BACKUP_REPO_SSH_KEY"
          echo "HTTPS: BACKUP_REPO_URL + BACKUP_REPO_TOKEN + BACKUP_REPO_USERNAME"
