name: Open Translation Proposal Pull Request

on:
  push:
    branches:
      - 'translation_proposals/**'
    paths:
      - 'i18n/proposals/pending/**'
      - 'i18n/artifacts/reports/**'
      - 'i18n/config/namespaces.json'
      - 'i18n/config/applications.json'
      - '.github/pull_request_template.md'
      - '.github/workflows/openTranslationProposalPr.yml'
  workflow_run:
    workflows:
      - Process Translation Editor Uploads
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: translation-proposal-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'translation_proposals/')) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'translation_proposals/'))
    runs-on: ubuntu-latest
    name: Open Or Update Proposal Pull Request

    steps:
      - name: Checkout Translation Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Fetch Main Branch
        run: git fetch origin main

      - name: Open Or Update Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const branch =
              context.eventName === 'workflow_run'
                ? context.payload.workflow_run.head_branch
                : context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';
            const reviewers = `${{ vars.TRANSLATION_PROPOSAL_REVIEWERS || '' }}`
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const teamReviewers = `${{ vars.TRANSLATION_PROPOSAL_TEAM_REVIEWERS || '' }}`
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const assignees = `${{ vars.TRANSLATION_PROPOSAL_ASSIGNEES || '' }}`
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const labels = [
              {
                name: 'translation-proposal',
                color: '0E8A16',
                description: 'New translation keys awaiting review before merge.'
              },
              {
                name: 'auto-generated',
                color: '5319E7',
                description: 'Pull request was created automatically by translation automation.'
              },
              {
                name: 'needs-review',
                color: 'D93F0B',
                description: 'Pull request is ready for reviewer or admin attention.'
              }
            ];

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            for (const label of labels) {
              await ensureLabel(label);
            }

            function getChangedProposalObjects() {
              const output = execFileSync(
                'git',
                ['diff', '--name-only', 'origin/main...HEAD', '--', 'i18n/proposals/pending'],
                { encoding: 'utf8' }
              );

              return output
                .split('\n')
                .map((value) => value.trim())
                .filter(Boolean);
            }

            function getChangedProposalReports() {
              const output = execFileSync(
                'git',
                ['diff', '--name-only', 'origin/main...HEAD', '--', 'i18n/artifacts/reports'],
                { encoding: 'utf8' }
              );

              return output
                .split('\n')
                .map((value) => value.trim())
                .filter(Boolean)
                .filter((filePath) => filePath.endsWith('.report.json'));
            }

            function loadProposalSummary(proposalPaths, reportPaths) {
              const summary = {
                proposalPaths,
                reportPaths,
                files: [],
                proposals: []
              };

              for (const proposalPath of proposalPaths) {
                const absolutePath = path.join(process.env.GITHUB_WORKSPACE, proposalPath);

                if (!fs.existsSync(absolutePath)) {
                  continue;
                }

                const proposalObject = JSON.parse(fs.readFileSync(absolutePath, 'utf8'));
                const sourceUploadFile =
                  proposalObject.source && typeof proposalObject.source.uploadFile === 'string'
                    ? proposalObject.source.uploadFile
                    : '';
                const proposalItems = Array.isArray(proposalObject.proposals)
                  ? proposalObject.proposals
                  : [proposalObject];

                summary.files.push({
                  proposalPath,
                  sourceUploadFile,
                  proposalCount: proposalItems.filter(Boolean).length
                });

                proposalItems.forEach((proposalItem, index) => {
                  const proposedEntry =
                    proposalItem && proposalItem.proposedEntry && typeof proposalItem.proposedEntry === 'object'
                      ? proposalItem.proposedEntry
                      : {};
                  const requestedNamespace =
                    proposalItem?.review && typeof proposalItem.review.requestedNamespace === 'string'
                      ? proposalItem.review.requestedNamespace
                      : proposalItem?.originalEntry && typeof proposalItem.originalEntry.requestedNamespace === 'string'
                        ? proposalItem.originalEntry.requestedNamespace
                        : '';
                  const suggestedNamespace =
                    proposalItem?.review && typeof proposalItem.review.suggestedNamespace === 'string'
                      ? proposalItem.review.suggestedNamespace
                      : '';

                  summary.proposals.push({
                    proposalId:
                      typeof proposalItem?.proposalId === 'string' && proposalItem.proposalId.trim() !== ''
                        ? proposalItem.proposalId.trim()
                        : `${path.basename(proposalPath, '.json')}-${index + 1}`,
                    proposalPath,
                    sourceUploadFile,
                    confidence:
                      proposalItem?.review && typeof proposalItem.review.confidence === 'string'
                        ? proposalItem.review.confidence
                        : 'unknown',
                    requestedNamespace,
                    suggestedNamespace,
                    reason:
                      proposalItem?.review && typeof proposalItem.review.reason === 'string'
                        ? proposalItem.review.reason
                        : '',
                    key: typeof proposedEntry.key === 'string' ? proposedEntry.key : '',
                    applications: Array.isArray(proposedEntry.applications) ? proposedEntry.applications : [],
                    nl: typeof proposedEntry.nl === 'string' ? proposedEntry.nl : '',
                    fr: typeof proposedEntry.fr === 'string' ? proposedEntry.fr : '',
                    en: typeof proposedEntry.en === 'string' ? proposedEntry.en : '',
                    description: typeof proposedEntry.description === 'string' ? proposedEntry.description : '',
                    notes: typeof proposedEntry.notes === 'string' ? proposedEntry.notes : ''
                  });
                });
              }

              return summary;
            }

            function formatInlineCode(value) {
              return typeof value === 'string' && value.trim() !== '' ? '`' + value + '`' : '_empty_';
            }

            function decodeHtmlEntities(value) {
              const entities = {
                '&nbsp;': ' ',
                '&amp;': '&',
                '&lt;': '<',
                '&gt;': '>',
                '&quot;': '"',
                '&#39;': "'"
              };

              return value.replace(/&(nbsp|amp|lt|gt|quot|#39);/g, (match) => entities[match] || match);
            }

            function htmlToPreviewText(value) {
              if (typeof value !== 'string' || value.trim() === '') {
                return '';
              }

              const readable = decodeHtmlEntities(
                value
                  .replace(/\r\n/g, '\n')
                  .replace(/<\s*br\s*\/?>/gi, '\n')
                  .replace(/<\s*\/p\s*>/gi, '\n\n')
                  .replace(/<\s*p[^>]*>/gi, '')
                  .replace(/<\s*li[^>]*>/gi, '- ')
                  .replace(/<\s*\/li\s*>/gi, '\n')
                  .replace(/<\s*\/?(ul|ol)[^>]*>/gi, '\n')
                  .replace(/<\s*\/?(strong|b)[^>]*>/gi, '')
                  .replace(/<\s*\/?(em|i)[^>]*>/gi, '')
                  .replace(/<[^>]+>/g, '')
              )
                .split('\n')
                .map((line) => line.trim())
                .filter(Boolean)
                .join(' / ')
                .replace(/\s+/g, ' ')
                .trim();

              if (readable.length <= 180) {
                return readable;
              }

              return `${readable.slice(0, 177)}...`;
            }

            function formatPreviewTextLine(label, value) {
              const preview = htmlToPreviewText(value);
              return preview ? `  ${label}: ${preview}` : '';
            }

            function buildBlobUrl(filePath) {
              return `https://github.com/${owner}/${repo}/blob/${branch}/${filePath}`;
            }

            function buildEditUrl(filePath) {
              return `https://github.com/${owner}/${repo}/edit/${branch}/${filePath}`;
            }

            function formatLink(label, url) {
              return `[${label}](${url})`;
            }

            const branchSlug = branch.replace(/^translation_proposals\//, '');
            const branchTitle = branchSlug
              .replace(/[-_]+/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
            const proposalPaths = getChangedProposalObjects();
            const reportPaths = getChangedProposalReports();
            const proposalSummary = loadProposalSummary(proposalPaths, reportPaths);
            const proposalPreview = proposalSummary.proposals.slice(0, 12);
            const editableFieldsText =
              'In elk `proposedEntry` blok: `key`, `applications`, `nl`, `fr`, `en`, `description`, `notes`.';

            function buildReviewFlowLines() {
              return [
                '1. Open het proposal-bestand in `i18n/proposals/pending/`.',
                '2. Pas alleen de `proposedEntry` blokken aan waar nodig.',
                '3. Commit the change on this proposal branch.',
                '4. Merge after approval and green checks.'
              ];
            }

            function buildProposalSectionLines() {
              if (proposalSummary.files.length === 0) {
                return ['- No proposal files found in this branch.'];
              }

              return proposalSummary.files.flatMap((file) => [
                `- ${formatLink('edit', buildEditUrl(file.proposalPath))} | ${formatLink(
                  'view',
                  buildBlobUrl(file.proposalPath)
                )} | \`${file.proposalPath}\``,
                `  Contains ${file.proposalCount} text(s)`,
                ...(file.sourceUploadFile ? [`  Upload \`${file.sourceUploadFile}\``] : [])
              ]);
            }

            function buildTextPreviewLines() {
              if (proposalPreview.length === 0) {
                return ['- No text previews available.'];
              }

              return proposalPreview.flatMap((proposal) => [
                `- \`${proposal.key || proposal.proposalId}\``,
                `  NL ${formatInlineCode(proposal.nl)} | FR ${formatInlineCode(proposal.fr)} | EN ${formatInlineCode(proposal.en)}`,
                ...[formatPreviewTextLine('Description', proposal.description)].filter(Boolean),
                ...[formatPreviewTextLine('Notes', proposal.notes)].filter(Boolean),
                ...(proposal.requestedNamespace || proposal.suggestedNamespace
                  ? [
                      `  Namespace requested ${formatInlineCode(proposal.requestedNamespace)} | suggested ${formatInlineCode(
                        proposal.suggestedNamespace
                      )}`
                    ]
                  : [])
              ]);
            }

            const proposalLines =
              buildProposalSectionLines();
            const textPreviewLines = buildTextPreviewLines();
            const extraProposalCount = proposalSummary.proposals.length - proposalPreview.length;

            const title = branchTitle
              ? `Translation Proposal: ${branchTitle}`
              : `Translation Proposal: ${branch}`;
            const hasConfiguredReviewRouting = reviewers.length > 0 || teamReviewers.length > 0;
            const hasConfiguredAssignees = assignees.length > 0;
            let reviewRoutingError = '';

            async function requestReviewersIndividually(kind, values) {
              const failures = [];

              for (const value of values) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner,
                    repo,
                    pull_number: pullNumber,
                    reviewers: kind === 'user' ? [value] : [],
                    team_reviewers: kind === 'team' ? [value] : []
                  });
                } catch (error) {
                  failures.push({
                    kind,
                    value,
                    message: error.message
                  });
                  core.warning(`Failed to request ${kind} reviewer "${value}": ${error.message}`);
                }
              }

              return failures;
            }

            function buildReviewRoutingWarning(failures) {
              if (failures.length === 0) {
                return '';
              }

              const labels = failures.map((failure) => `${failure.kind} "${failure.value}"`);
              return `Automatic reviewer request failed for ${labels.join(', ')}. Update the configured reviewer/team slug or grant that reviewer access to this repository.`;
            }

            function buildStatusLines() {
              const lines = [
                `- Branch: \`${branch}\``,
                `- Proposal files: ${proposalSummary.files.length}`,
                `- Texts to review: ${proposalSummary.proposals.length}`
              ];

              if (!hasConfiguredReviewRouting) {
                lines.push('- Reviewers: not configured');
              }

              if (!hasConfiguredAssignees) {
                lines.push('- Assignees: not configured');
              }

              return lines;
            }

            function buildPullRequestBody() {
              return [
                '## Translation Proposal',
                '',
                'Nieuwe teksten uit de applicatie. Pas de proposal file aan indien nodig en merge daarna.',
                '',
                '### Status',
                '',
                ...buildStatusLines(),
                '',
                '### Do This',
                '',
                ...buildReviewFlowLines(),
                '',
                '### Edit Only',
                '',
                editableFieldsText,
                '',
                '### Proposal Files',
                '',
                ...proposalLines,
                '',
                '### Text Preview',
                '',
                ...textPreviewLines,
                ...(extraProposalCount > 0 ? [`- plus ${extraProposalCount} additional text(s)`] : []),
                '',
                '### Merge',
                '',
                'Gebruik `Merge pull request` na approval en groene checks.',
                'Na merge wordt dit automatisch op `main` toegepast.',
                '',
                ...(proposalSummary.reportPaths.length > 0
                  ? [
                      '### Reports',
                      '',
                      ...proposalSummary.reportPaths.map((reportPath) => `- \`${reportPath}\``),
                      ''
                    ]
                  : []),
                '',
                ...(reviewRoutingError
                  ? [
                      '### Reviewer Routing Warning',
                      '',
                      reviewRoutingError,
                      ''
                    ]
                  : []),
                ...(!hasConfiguredReviewRouting
                  ? [
                      '### Config',
                      '',
                      'Set `TRANSLATION_PROPOSAL_REVIEWERS` or `TRANSLATION_PROPOSAL_TEAM_REVIEWERS` for automatische review routing.',
                      ''
                    ]
                  : []),
                ...(!hasConfiguredAssignees
                  ? [
                      'Set `TRANSLATION_PROPOSAL_ASSIGNEES` if je automatische toewijzing wil.',
                      ''
                    ]
                  : []),
              ].join('\n');
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base
            });

            let pullNumber;

            if (existing.data.length === 0) {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base,
                body: buildPullRequestBody()
              });

              pullNumber = created.data.number;
              core.info(`Created pull request #${pullNumber} for ${branch}.`);
            } else {
              pullNumber = existing.data[0].number;
              core.info(`Using existing pull request #${pullNumber} for ${branch}.`);

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pullNumber,
                title,
                body: buildPullRequestBody()
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullNumber,
              labels: labels.map((label) => label.name)
            });

            if (assignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: pullNumber,
                assignees
              });
            }

            if (reviewers.length > 0 || teamReviewers.length > 0) {
              const routingFailures = [];

              routingFailures.push(...(await requestReviewersIndividually('user', reviewers)));
              routingFailures.push(...(await requestReviewersIndividually('team', teamReviewers)));

              reviewRoutingError = buildReviewRoutingWarning(routingFailures);

              if (reviewRoutingError) {
                core.warning(reviewRoutingError);
              }
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pullNumber,
              title,
              body: buildPullRequestBody()
            });

            const guidanceMarker = '<!-- translation-proposal-review-guide -->';
            function buildGuidanceBody() {
              return [
                guidanceMarker,
                '## Review Guide',
                '',
                'Korte handleiding voor deze proposal-PR.',
                '',
                '### Status',
                '',
                ...buildStatusLines(),
                '',
                '### Do This',
                '',
                ...buildReviewFlowLines(),
                '',
                '### Edit Only',
                '',
                editableFieldsText,
                '',
                '### Proposal Files',
                '',
                ...proposalLines,
                '',
                '### Text Preview',
                '',
                ...textPreviewLines,
                ...(extraProposalCount > 0 ? [`- plus ${extraProposalCount} additional text(s)`] : []),
                '',
                '### Merge',
                '',
                'Klik `Merge pull request` na approval en groene checks.',
                'Na merge wordt dit automatisch op `main` toegepast.',
                '',
                ...(reviewRoutingError
                  ? [
                      '### Reviewer Routing Warning',
                      '',
                      reviewRoutingError,
                      ''
                    ]
                  : []),
                ...(hasConfiguredReviewRouting
                  ? []
                  : [
                      '### Config',
                      '',
                      'Configure `TRANSLATION_PROPOSAL_REVIEWERS` or `TRANSLATION_PROPOSAL_TEAM_REVIEWERS`.',
                      ''
                    ]),
                ...(hasConfiguredAssignees
                  ? []
                  : [
                      'Configure `TRANSLATION_PROPOSAL_ASSIGNEES` if je automatische toewijzing wil.',
                      ''
                    ])
              ].join('\n');
            }

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100
            });

            const existingGuidanceComment = comments.data.find(
              (comment) =>
                comment.user &&
                comment.user.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(guidanceMarker)
            );

            if (existingGuidanceComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingGuidanceComment.id,
                body: buildGuidanceBody()
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: buildGuidanceBody()
              });
            }
