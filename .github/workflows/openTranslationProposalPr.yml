name: Open Translation Proposal Pull Request

on:
  push:
    branches:
      - 'translation_proposals/**'
    paths:
      - 'i18n/proposals/pending/**'
      - 'i18n/artifacts/reports/**'
      - 'i18n/config/namespaces.json'
      - 'i18n/config/applications.json'
      - '.github/pull_request_template.md'
      - '.github/workflows/openTranslationProposalPr.yml'
  workflow_run:
    workflows:
      - Process Translation Editor Uploads
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: translation-proposal-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'translation_proposals/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'translation_proposals/'))
    runs-on: ubuntu-latest
    name: Open Or Update Proposal Pull Request

    steps:
      - name: Checkout Translation Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Fetch Main Branch
        run: git fetch origin main

      - name: Open Or Update Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const branch =
              context.eventName === 'workflow_run'
                ? context.payload.workflow_run.head_branch
                : context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';
            const reviewers = `${{ vars.TRANSLATION_PROPOSAL_REVIEWERS || '' }}`
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const teamReviewers = `${{ vars.TRANSLATION_PROPOSAL_TEAM_REVIEWERS || '' }}`
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const assignees = `${{ vars.TRANSLATION_PROPOSAL_ASSIGNEES || '' }}`
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);
            const labels = [
              {
                name: 'translation-proposal',
                color: '0E8A16',
                description: 'New translation keys awaiting review before merge.'
              },
              {
                name: 'auto-generated',
                color: '5319E7',
                description: 'Pull request was created automatically by translation automation.'
              },
              {
                name: 'needs-review',
                color: 'D93F0B',
                description: 'Pull request is ready for reviewer or admin attention.'
              }
            ];

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            for (const label of labels) {
              await ensureLabel(label);
            }

            function getChangedProposalObjects() {
              const output = execFileSync(
                'git',
                ['diff', '--name-only', 'origin/main...HEAD', '--', 'i18n/proposals/pending'],
                { encoding: 'utf8' }
              );

              return output
                .split('\n')
                .map((value) => value.trim())
                .filter(Boolean);
            }

            function getChangedProposalReports() {
              const output = execFileSync(
                'git',
                ['diff', '--name-only', 'origin/main...HEAD', '--', 'i18n/artifacts/reports'],
                { encoding: 'utf8' }
              );

              return output
                .split('\n')
                .map((value) => value.trim())
                .filter(Boolean)
                .filter((filePath) => filePath.endsWith('.report.json'));
            }

            function loadProposalSummary(proposalPaths, reportPaths) {
              const summary = {
                proposalPaths,
                reportPaths,
                proposals: []
              };

              for (const proposalPath of proposalPaths) {
                const absolutePath = path.join(process.env.GITHUB_WORKSPACE, proposalPath);

                if (!fs.existsSync(absolutePath)) {
                  continue;
                }

                const proposalObject = JSON.parse(fs.readFileSync(absolutePath, 'utf8'));
                const proposedEntry =
                  proposalObject && proposalObject.proposedEntry && typeof proposalObject.proposedEntry === 'object'
                    ? proposalObject.proposedEntry
                    : {};

                summary.proposals.push({
                  proposalId:
                    typeof proposalObject.proposalId === 'string' && proposalObject.proposalId.trim() !== ''
                      ? proposalObject.proposalId.trim()
                      : path.basename(proposalPath, '.json'),
                  proposalPath,
                  sourceUploadFile:
                    proposalObject.source && typeof proposalObject.source.uploadFile === 'string'
                      ? proposalObject.source.uploadFile
                      : '',
                  confidence:
                    proposalObject.review && typeof proposalObject.review.confidence === 'string'
                      ? proposalObject.review.confidence
                      : 'unknown',
                  reason:
                    proposalObject.review && typeof proposalObject.review.reason === 'string'
                      ? proposalObject.review.reason
                      : '',
                  key: typeof proposedEntry.key === 'string' ? proposedEntry.key : '',
                  applications: Array.isArray(proposedEntry.applications) ? proposedEntry.applications : [],
                  nl: typeof proposedEntry.nl === 'string' ? proposedEntry.nl : '',
                  fr: typeof proposedEntry.fr === 'string' ? proposedEntry.fr : '',
                  en: typeof proposedEntry.en === 'string' ? proposedEntry.en : '',
                  description: typeof proposedEntry.description === 'string' ? proposedEntry.description : '',
                  notes: typeof proposedEntry.notes === 'string' ? proposedEntry.notes : ''
                });
              }

              return summary;
            }

            function formatInlineCode(value) {
              return typeof value === 'string' && value.trim() !== '' ? '`' + value + '`' : '_empty_';
            }

            function buildBlobUrl(filePath) {
              return `https://github.com/${owner}/${repo}/blob/${branch}/${filePath}`;
            }

            function buildEditUrl(filePath) {
              return `https://github.com/${owner}/${repo}/edit/${branch}/${filePath}`;
            }

            function formatLink(label, url) {
              return `[${label}](${url})`;
            }

            const branchSlug = branch.replace(/^translation_proposals\//, '');
            const branchTitle = branchSlug
              .replace(/[-_]+/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
            const proposalPaths = getChangedProposalObjects();
            const reportPaths = getChangedProposalReports();
            const proposalSummary = loadProposalSummary(proposalPaths, reportPaths);
            const proposalPreview = proposalSummary.proposals.slice(0, 12);
            const proposalLines =
              proposalPreview.length > 0
                ? proposalPreview.flatMap((proposal) => [
                    `#### \`${proposal.key || proposal.proposalId}\``,
                    '',
                    `- proposal file: \`${proposal.proposalPath}\``,
                    `- quick actions: ${formatLink('view file', buildBlobUrl(proposal.proposalPath))} | ${formatLink('edit file', buildEditUrl(proposal.proposalPath))}`,
                    ...(proposal.sourceUploadFile ? [`- source upload: \`${proposal.sourceUploadFile}\``] : []),
                    `- confidence: \`${proposal.confidence}\``,
                    `- applications: ${
                      proposal.applications.length > 0
                        ? proposal.applications.map((value) => `\`${value}\``).join(', ')
                        : '_missing_'
                    }`,
                    `- nl: ${formatInlineCode(proposal.nl)}`,
                    `- fr: ${formatInlineCode(proposal.fr)}`,
                    `- en: ${formatInlineCode(proposal.en)}`,
                    ...(proposal.description ? [`- description: ${formatInlineCode(proposal.description)}`] : []),
                    ...(proposal.notes ? [`- notes: ${formatInlineCode(proposal.notes)}`] : []),
                    ...(proposal.reason ? [`- routing reason: ${proposal.reason}`] : []),
                    ''
                  ])
                : ['- No proposal objects were available in the branch diff.'];
            const extraProposalCount = proposalSummary.proposals.length - proposalPreview.length;

            const title = branchTitle
              ? `Translation Proposal: ${branchTitle}`
              : `Translation Proposal: ${branch}`;
            const hasConfiguredReviewRouting = reviewers.length > 0 || teamReviewers.length > 0;
            const hasConfiguredAssignees = assignees.length > 0;

            const body = [
              '## Translation Proposal',
              '',
              'This pull request was opened automatically for newly proposed translation keys.',
              '',
              '### Summary',
              '',
              `- branch: \`${branch}\``,
              `- proposal objects: ${proposalSummary.proposalPaths.length}`,
              `- proposal reports: ${proposalSummary.reportPaths.length}`,
              `- proposed keys: ${proposalSummary.proposals.length}`,
              `- reviewers configured: ${hasConfiguredReviewRouting ? 'yes' : 'no'}`,
              `- assignees configured: ${hasConfiguredAssignees ? 'yes' : 'no'}`,
              '',
              '### What To Do In This PR',
              '',
              '1. Open the proposal files listed below.',
              '2. Click the `edit file` link for any object that needs changes.',
              '3. Update `proposedEntry.key`, `proposedEntry.applications`, and the locale text as needed.',
              '4. Request changes or approve only after the proposal objects are final.',
              '5. Merge the PR only when the validation workflow is green.',
              '',
              '### Reviewable Proposal Objects',
              '',
              'Reviewers should edit the files under `i18n/proposals/pending/` in this PR when the key, applications, or locale text needs adjustment before merge.',
              '',
              ...proposalLines,
              ...(extraProposalCount > 0 ? [`- plus ${extraProposalCount} additional proposal object(s)`] : []),
              '',
              ...(proposalSummary.reportPaths.length > 0
                ? [
                    '### Report Files',
                    '',
                    ...proposalSummary.reportPaths.map((reportPath) => `- \`${reportPath}\``),
                    ''
                  ]
                : []),
              '',
              ...(!hasConfiguredReviewRouting
                ? [
                    '### Configuration Needed',
                    '',
                    'Automatic reviewers are not configured yet.',
                    'Set repository variable `TRANSLATION_PROPOSAL_REVIEWERS` or `TRANSLATION_PROPOSAL_TEAM_REVIEWERS` to request reviews automatically.',
                    ''
                  ]
                : []),
              ...(!hasConfiguredAssignees
                ? [
                    'Automatic assignees are not configured yet.',
                    'Set repository variable `TRANSLATION_PROPOSAL_ASSIGNEES` if you want the PR to auto-assign maintainers.',
                    ''
                  ]
                : []),
              '',
              'Review expectations:',
              '- verify the final key and namespace inside each proposal object',
              '- verify the locale text and application scope',
              '- edit the proposal object files in the PR when changes are needed',
              '- merge only after the translation validation workflow is green',
              '',
              'Operational rule:',
              '- existing keys may still flow directly to `main`',
              '- new keys must land through reviewed proposal object files before merge',
              '- merging this PR applies the final approved proposal objects on `main`'
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base
            });

            let pullNumber;

            if (existing.data.length === 0) {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base,
                body
              });

              pullNumber = created.data.number;
              core.info(`Created pull request #${pullNumber} for ${branch}.`);
            } else {
              pullNumber = existing.data[0].number;
              core.info(`Using existing pull request #${pullNumber} for ${branch}.`);

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pullNumber,
                title,
                body
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullNumber,
              labels: labels.map((label) => label.name)
            });

            if (assignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: pullNumber,
                assignees
              });
            }

            if (reviewers.length > 0 || teamReviewers.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pullNumber,
                reviewers,
                team_reviewers: teamReviewers
              });
            }

            const guidanceMarker = '<!-- translation-proposal-review-guide -->';
            const guidanceBody = [
              guidanceMarker,
              '## Review Guide',
              '',
              'This PR is meant to be reviewed by editing the proposal object files directly.',
              '',
              '### Reviewer Steps',
              '',
              '1. Open the `Files changed` tab.',
              '2. Find the files under `i18n/proposals/pending/`.',
              '3. If something is wrong, click the edit link below and change the JSON in `proposedEntry`.',
              '4. Approve only when those proposal objects are final.',
              '',
              '### Direct Edit Links',
              '',
              ...(proposalPreview.length > 0
                ? proposalPreview.map(
                    (proposal) =>
                      `- \`${proposal.key || proposal.proposalId}\`: ${formatLink(
                        'edit proposal file',
                        buildEditUrl(proposal.proposalPath)
                      )} | ${formatLink('view proposal file', buildBlobUrl(proposal.proposalPath))}`
                  )
                : ['- No proposal objects were found in this branch diff.']),
              '',
              '### Edit Only These Fields',
              '',
              '- `proposedEntry.key`',
              '- `proposedEntry.applications`',
              '- `proposedEntry.nl`',
              '- `proposedEntry.fr`',
              '- `proposedEntry.en`',
              '- optional: `proposedEntry.description`',
              '- optional: `proposedEntry.notes`',
              '',
              ...(hasConfiguredReviewRouting
                ? []
                : [
                    '### Missing Review Routing',
                    '',
                    'No automatic reviewers are configured for proposal PRs yet.',
                    'Configure repository variables `TRANSLATION_PROPOSAL_REVIEWERS` or `TRANSLATION_PROPOSAL_TEAM_REVIEWERS` to fix that.',
                    ''
                  ]),
              ...(hasConfiguredAssignees
                ? []
                : [
                    'No automatic assignees are configured yet.',
                    'Configure repository variable `TRANSLATION_PROPOSAL_ASSIGNEES` if you want an owner assigned automatically.',
                    ''
                  ])
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100
            });

            const existingGuidanceComment = comments.data.find(
              (comment) =>
                comment.user &&
                comment.user.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(guidanceMarker)
            );

            if (existingGuidanceComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingGuidanceComment.id,
                body: guidanceBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: guidanceBody
              });
            }
