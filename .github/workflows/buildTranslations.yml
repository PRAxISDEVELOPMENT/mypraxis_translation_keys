#
# Validates the translation source and rebuilds generated artifacts.
# PRs are checked for validity and sync.
# Pushes to main regenerate i18n/artifacts/generated/*.json and commit them when needed.
#

name: Validate And Build Translation Artifacts

on:
  pull_request:
    paths:
      - 'i18n/source/translations.json'
      - 'i18n/config/**'
      - 'i18n/bin/*.js'
      - 'i18n/src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/buildTranslations.yml'
      - '.github/workflows/processTranslationUploads.yml'
  push:
    branches:
      - main
    paths:
      - 'i18n/source/translations.json'
      - 'i18n/config/**'
      - 'i18n/bin/*.js'
      - 'i18n/src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/buildTranslations.yml'
      - '.github/workflows/processTranslationUploads.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Validate Pull Request Translation Changes

    permissions:
      contents: read

    steps:
      - name: Checkout Translation Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Translation Tooling Syntax
        run: npm run tooling:check-syntax

      - name: Validate Translation Source
        run: node i18n/bin/build-translations.js

      - name: Verify Generated Artifacts Are In Sync
        run: node i18n/bin/build-translations.js --check

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Regenerate Translation Artifacts On Main

    steps:
      - name: Checkout Translation Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Translation Tooling Syntax
        run: npm run tooling:check-syntax

      - name: Regenerate Translation Artifacts
        run: node i18n/bin/build-translations.js

      - name: Commit Regenerated Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add i18n/artifacts/generated/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Translation Bot: Regenerate Generated Files"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
